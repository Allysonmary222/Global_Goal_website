<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalCryptos.Trade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        .logo {
            font-size: 60px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 16px;
            color: #a8b2d1;
            margin-bottom: 30px;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #ffd200;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .redirect-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            color: #1a1a2e;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            transition: transform 0.2s;
        }
        .redirect-link:hover {
            transform: scale(1.05);
        }
        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #5a6a8a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚀</div>
        <h1>GlobalCryptos.Trade</h1>
        <p class="subtitle">Fast cross-border crypto deals • OTC • P2P • 50+ Countries</p>
        <div class="spinner"></div>
        <p style="margin: 15px 0 5px; color: #a8b2d1;">Redirecting to our Telegram channel...</p>
        <a href="https://t.me/GlobalCryptosTrade" class="redirect-link">🔗 Click here if not redirected</a>
        <p class="footer">You will be redirected automatically in a moment</p>
    </div>

    <script>
        // IMMEDIATE REDIRECT - this happens as soon as the script loads
        window.location.replace('https://t.me/GlobalCryptosTrade');
    </script>
</body>
</html>
